<style>

*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:520px;margin:auto;padding:10px}
h1,h2{margin:.4em 0}input,textarea,button{font:inherit}
input,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.nf{flex:0 0 auto!important}
.pl{min-width:58px;padding:8px 2px;font-weight:700;font-size:15px}.pl small{display:block;font-weight:400;color:var(--mut);font-size:10px;overflow:hidden;white-space:nowrap}
.pl.on{background:var(--ac);color:#fff}.pl.on small,.pl.sw small{color:#fff}.pl.sw{background:var(--tl);color:#fff}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0;align-items:center}button:disabled{opacity:.4}
.g button{height:52px;padding:0;font-weight:700;color:#fff;background:var(--bl);border:0;font-size:17px}
.g .m{background:var(--tl)}.g .x{background:var(--ko)}.g .u{background:#888}
.g .ck{background:var(--card);color:var(--tx);border:3px solid var(--ac);font-size:15px;border-radius:50%;width:66px;height:66px;margin:0 auto}

.tabs button{border-radius:0;border:0;border-bottom:3px solid transparent;background:none}.tabs button.on{border-color:var(--ac);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}td:first-child,th:first-child{text-align:left}
.mut{color:var(--mut);font-size:13px}.err{color:var(--ko)}.sc{font-size:22px;font-weight:800;text-align:center}
select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}label{display:block;margin-top:8px}
.nw{flex-wrap:nowrap}.bb button{font-size:14px;padding:10px 2px}.g .pend{outline:3px solid var(--ac);outline-offset:1px}
.g .ck{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.ov .card{max-width:340px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translateX(-50%)}
body{background:linear-gradient(160deg,var(--bg),var(--bg)) fixed}
button{border-radius:12px;transition:transform .1s,background .15s,opacity .15s}button:active{transform:scale(.95)}
.card{border-radius:16px;box-shadow:0 2px 12px #7c5cff14}
.g .ck{border-radius:14px;width:100%;height:74px;margin:0;font-size:22px;font-weight:800}
input[type=checkbox]{width:auto;margin-right:6px}
.bubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.bub{text-align:left;padding:10px;border-radius:14px}.bub small{display:block;color:var(--mut)}.bub.add{font-size:26px;text-align:center;color:var(--ac)}
.ov .card{max-height:90vh;overflow:auto}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
#app.fx>*:not(.ov){animation:in .3s cubic-bezier(.2,.8,.2,1) both}#app.fx>*:nth-child(2){animation-delay:.04s}#app.fx>*:nth-child(3){animation-delay:.08s}#app.fx>*:nth-child(4){animation-delay:.12s}
#app.fx .ov{animation:fade .2s}#app.fx .ov .card{animation:pop .22s}
.g button{font-size:15px}.g s{font-size:19px;text-decoration-thickness:2px}
.wr{position:relative;flex:0 0 90px}.wr::after{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-radius:10px;background:var(--ac);opacity:.14;pointer-events:none}
.wh{height:220px;touch-action:none;user-select:none;cursor:ns-resize;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wi{height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:none}
.pl.f4{box-shadow:inset 0 -3px 0 #f59f00}.pl.f5{box-shadow:inset 0 -3px 0 var(--ko)}.pl.long{border-color:#f59f00;background:#f59f0022}
.tl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin:6px 0 2px}.tl b{color:var(--tx)}

.g .fo{background:#f76707}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--bd);font-size:11px;font-weight:700;vertical-align:middle}.bub .av{display:flex;margin-bottom:4px}
.bad{background:#f0555e1f;color:var(--ko);border-color:#f0555e66}.good{background:#12b8861f;color:var(--ok);border-color:#12b88666}

<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// >>> À REMPLIR
const SUPABASE_URL="https://zpcvjfwvehfcfnapzvtp.supabase.co", SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwY3ZqZnd2ZWhmY2ZuYXB6dnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTYzMjksImV4cCI6MjEwNjIzMjMyOX0.-Ix-EpglLNyXt8_Zre2fNmAKuwutN1Ql7ghnhp7Hgq4";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={user:null,view:'login',matches:[],m:null,ev:[],sel:null,ps:null,edit:null,dlg:null,pop:null,pe:null,ex:false,teams:[],evc:{},obs:false,ss:null,clk:null,role:null,users:null,te:null,xo:0,mf:'',omode:'follow',stt:null,panel:null,so:[],si:[],qt:1,rem:600,run:false,last:0,tab:'rec',err:''};
let Q=JSON.parse(localStorage.q||'{"i":[],"d":[]}'),tk=null;
const saveQ=()=>localStorage.q=JSON.stringify(Q);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=p=>p.k!=null?p.k:(p.o?p.n+1000:p.n);
const parse=(t,o)=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [n,...r]=l.split(/\s+/);const p={n:parseInt(n),name:r.join(' ')};if(o)p.o=1;return p}).filter(p=>!isNaN(p.n));
const TL={t2m:'+2 pts',t2x:'2 pts raté',t3m:'+3 pts',t3x:'3 pts raté',lfm:'+LF',lfx:'LF raté',ro:'Rebond off.',rd:'Rebond déf.',ast:'Passe déc.',stl:'Interception',blk:'Contre',tov:'Balle perdue',pf:'Faute',fr:'Faute provoquée'};
const who=k=>{const p=S.m.roster.find(p=>K(p)==k);return p?`#${p.n} ${p.name} (${p.o?(S.m.opp||'Adv.'):S.m.team})`:'joueur retiré'};
const PL=p=>p>S.m.np?'PR'+(p-S.m.np):'QT'+p;
const plen=p=>p<=S.m.np?S.m.dur:300;
const start=p=>{let s=0;for(let i=1;i<p;i++)s+=plen(i);return s};
const tt=(q,c)=>start(q)+plen(q)-c;
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const pending=()=>Q.i.length+Q.d.length?`⏳ ${Q.i.length+Q.d.length} en attente`:'✅ synchronisé';

async function sync(){
  if(!S.user)return;
  try{
    const a=Q.i.slice(),d=Q.d.slice();
    if(a.length){const r=await sb.from('events').upsert(a);if(r.error)throw r.error;Q.i=Q.i.filter(x=>!a.includes(x));}
    if(d.length){const r=await sb.from('events').delete().in('id',d);if(r.error)throw r.error;Q.d=Q.d.filter(x=>!d.includes(x));}
    saveQ();
  }catch(e){}
  const p=$('pend');if(p)p.textContent=pending();
}
setInterval(sync,5000);addEventListener('online',sync);

async function login(){
  if(SUPABASE_KEY.includes('COLLE_ICI')){S.err="Clé Supabase non renseignée.";return draw();}
  const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){S.err='Erreur : '+r.error.message;return draw();}
  S.user=r.data.user;S.err='';await loadRole();home();
}
async function logout(){await sb.auth.signOut();S.user=null;S.view='login';draw();}
async function home(){
  stopClock();if(wl){wl.release();wl=null;}S.view='home';draw();
  const r=await sb.from('matches').select('*').order('created_at',{ascending:false});
  S.matches=r.data||[];const tr=await sb.from('teams').select('*');S.teams=tr.data||[];draw();
}
async function createMatch(){
  const nm=id=>{const v=$(id).value;return v=='__new'?$(id+'n').value.trim():v},tn=nm('tm'),on=nm('op');
  if(!tn){S.err="Choisis ou crée ton équipe";return draw();}
  const imp=(nm,o)=>{const t=S.teams.find(t=>t.name.toLowerCase()==nm.toLowerCase());return t?t.players.map((p,i)=>({...p,k:(o?1000:0)+i,...(o?{o:1}:{})})):[]};
  const roster=imp(tn,0).concat(imp(on,1));
  const r=await sb.from('matches').insert({team:tn,opp:on,roster,season:(()=>{const v=$('sea').value;return (v=='__new'?$('sean').value.trim():v)||null})(),in_season:$('ins').checked,np:parseInt($('np').value)||4,dur:(parseInt($('du').value)||10)*60}).select().single();
  if(r.error){S.err=r.error.message;return draw();}
  S.err='';openMatch(r.data);
}
async function openMatch(m){
  S.m=m;S.sel=null;S.ps=null;S.edit=null;S.dlg=null;S.pop=null;S.pe=null;S.ex=false;S.ck=null;S.panel=null;S.so=[];S.si=[];S.tab='rec';S.view='live';S.to=null;wake();
  const c=JSON.parse(localStorage['c'+m.id]||'null');
  S.qt=c?c.q:1;S.rem=c?c.rem:m.dur;S.run=false;
  const r={data:await fetchAll([m.id])};
  const dels=new Set(Q.d);
  S.ev=(r.data||[]).filter(e=>!dels.has(e.id));
  Q.i.filter(e=>e.match_id==m.id&&!S.ev.some(x=>x.id==e.id)).forEach(e=>S.ev.push(e));
  S.ev.sort((a,b)=>a.ts-b.ts);if(!S.ev.length&&!m.closed&&canW())initStart();draw();
}
/* chrono */
const saveC=()=>{localStorage['c'+S.m.id]=JSON.stringify({q:S.qt,rem:S.rem});pushClk();};
function stopClock(){S.run=false;clearInterval(tk);pushClk();}
function clockToggle(){
  if(S.run){stopClock();saveC();return draw();}
  if(S.rem<=0)return;
  startClock();draw();
}
function startClock(){if(S.run||S.rem<=0)return;S.run=true;S.last=Date.now();tk=setInterval(tick,250);pushClk();}
function tick(){
  const n=Date.now();S.rem=Math.max(0,S.rem-(n-S.last)/1000);S.last=n;
  if(S.rem<=0){stopClock();vib(600);beep();saveC();if(S.qt<S.m.np+2)ask(`Fin de <b>${PL(S.qt)}</b>. Passer à <b>${PL(S.qt+1)}</b> ?<br><span class="mut">Vérifie que toutes les stats sont enregistrées.</span>`,()=>setPeriod(S.qt+1));else draw();return;}
  const c=$('clk');if(c)c.textContent=mmss(Math.ceil(S.rem));
}
function setPeriod(p){stopClock();S.qt=p;S.rem=plen(p);saveC();draw();}
function setClock(){stopClock();const t=Math.ceil(S.rem);S.ck={m:Math.floor(t/60),s:t%60,mx:Math.max(Math.floor(plen(S.qt)/60),Math.floor(t/60))};draw();}
function ckOk(){S.rem=S.ck.m*60+S.ck.s;S.ck=null;saveC();draw();}
function ckNo(){S.ck=null;draw();}
let cd=null;
function wI(k){const v=S.ck[k],r=[];for(let d=-2;d<=2;d++){let x=v+d;if(k=='s')x=(x+60)%60;const ok=k=='s'||(x>=0&&x<=S.ck.mx);r.push(`<div class="wi" style="opacity:${d==0?1:Math.abs(d)==1?.5:.2};font-size:${d?22:34}px">${ok?String(x).padStart(2,'0'):''}</div>`);}return r.join('');}
function ckSet(k,v){S.ck[k]=k=='s'?((v%60)+60)%60:Math.max(0,Math.min(S.ck.mx,v));const w=$('w'+k);if(w)w.innerHTML=wI(k);}
function ckDown(e,k){cd={y:e.clientY,v:S.ck[k],mv:0};e.currentTarget.setPointerCapture(e.pointerId);}
function ckMove(e,k){if(!cd)return;const dy=e.clientY-cd.y;if(Math.abs(dy)>6)cd.mv=1;ckSet(k,cd.v+Math.round(-dy/36));}
function ckUp(e,k){if(cd&&!cd.mv){const r=e.currentTarget.getBoundingClientRect();ckSet(k,cd.v+Math.floor((e.clientY-r.top)/44)-2);}cd=null;}
function ckWheel(e,k){e.preventDefault();ckSet(k,S.ck[k]+(e.deltaY>0?1:-1));}
function ckH(){if(!S.ck)return '';
  const col=k=>`<div class="wr"><div class="wh" id="w${k}" onpointerdown="ckDown(event,'${k}')" onpointermove="ckMove(event,'${k}')" onpointerup="ckUp(event,'${k}')" onpointercancel="ckUp(event,'${k}')" onwheel="ckWheel(event,'${k}')">${wI(k)}</div></div>`;
  return `<div class="ov"><div class="card" style="text-align:center"><b>Régler le chrono</b><div class="row nw" style="justify-content:center;align-items:center;margin:10px 0">${col('m')}<span style="flex:0 0 auto;font-size:28px;font-weight:800">:</span>${col('s')}</div><div class="mut">minutes · secondes — fais glisser les roues (1 seconde par cran)</div><div class="row" style="margin-top:12px"><button onclick="ckNo()">Annuler</button><button class="p" onclick="ckOk()">Valider</button></div></div></div>`;}
/* événements */
function add(type,player,ts){
  const e={id:crypto.randomUUID(),match_id:S.m.id,player,type,quarter:S.qt,clock:Math.ceil(S.rem),ts:ts||Date.now()};
  S.ev.push(e);Q.i.push(e);saveQ();sync();saveC();return e;
}
const court=()=>{const c=[];S.ev.forEach(e=>{if(e.type=='in'&&!c.includes(e.player))c.push(e.player);if(e.type=='out'){const i=c.indexOf(e.player);if(i>=0)c.splice(i,1)}});return c};
const SH=['t2m','t2x','t3m','t3x'];
const lbl=k=>{const p=S.m.roster.find(p=>K(p)==k);return p?'#'+p.n+' '+p.name:'?'};
const mates=(k,same)=>court().filter(x=>((x>=1000)==(k>=1000))==same&&x!=k&&S.m.roster.some(p=>K(p)==x));
function rec(k,t){
  if(lock())return;
  const e=add(t,k);
  if(t=='pf'||t=='fr')stopClock();else if(t!='lfm'&&t!='lfx')startClock();
  toast(TL[t]+' — '+who(k));
  vib(15);
  if(t=='pf'&&S.ev.filter(x=>x.type=='pf'&&x.player==k).length>=5)toast('⚠️ '+who(k)+' : 5e faute — exclu');
  S.sel=null;S.ps=null;follow(e);
}
function pick(title,ks,f){if(ks.length)pop({t:title,sk:'Ignorer',opts:ks.map(x=>[lbl(x),()=>f(x)])});}
function scored(x,ty){const e=add(ty,x);toast(TL[ty]+' — '+who(x));pop({map:1,t:'Où était le tir ?',e});}
function follow(e){
  const k=e.player,t=e.type;
  if(SH.includes(t))return pop({map:1,t:'Où était le tir ? ('+TL[t]+')',e,sk:'Passer',then:()=>{if(t[2]=='m'){const m=mates(k,true);if(m.length)pop({t:'Passe décisive ?',sk:'Sans passe',opts:m.map(x=>[lbl(x),()=>{add('ast',x);toast('Passe déc. — '+who(x))}])});}}});
  if(t=='pf')pick('Qui a subi la faute ?',mates(k,false),x=>{add('fr',x);toast('Faute provoquée — '+who(x))});
  if(t=='fr')pick('Qui a fait la faute ?',mates(k,false),x=>{add('pf',x);toast('Faute — '+who(x))});
  if(t=='ast')pick('Qui a marqué ?',mates(k,true),x=>pop({t:'Type de panier',sk:'Annuler',opts:[['+2 pts',()=>scored(x,'t2m')],['+3 pts',()=>scored(x,'t3m')]]}));
}
function pop(o){S.pop=o;draw();}
function popGo(i){const f=S.pop.opts[i][1];S.pop=null;f();draw();}
function popNo(){const c=S.pop.then;S.pop=null;if(c)c();draw();}
function mapClick(ev){const r=ev.currentTarget.getBoundingClientRect();S.pop.x=+((ev.clientX-r.left)/r.width*100).toFixed(1);S.pop.y=+((ev.clientY-r.top)/r.height*94).toFixed(1);draw();}
function mapOk(){const P=S.pop,e=P.e;e.x=P.x;e.y=P.y;Q.i=Q.i.filter(x=>x.id!=e.id);Q.i.push(e);saveQ();sync();S.pop=null;if(P.then)P.then();draw();}
const COURT=`<g fill="none" stroke="currentColor" stroke-width=".8" opacity=".75"><rect x=".4" y=".4" width="99.2" height="93.2"/><rect x="34" y="56" width="32" height="37.6"/><circle cx="50" cy="56" r="12"/><circle cx="50" cy="83.5" r="2.5"/><path d="M6 93.6V65.6A47.5 47.5 0 0 1 94 65.6V93.6M44 88.5h12M42 83.5A8 8 0 0 1 58 83.5"/></g>`;
const dots=ev=>ev.map(e=>e.type[2]=='m'?`<circle cx="${e.x}" cy="${e.y}" r="1.8" fill="#12b886"/>`:`<circle cx="${e.x}" cy="${e.y}" r="1.7" fill="none" stroke="#f0555e" stroke-width=".9"/>`).join('');
function popH(){const P=S.pop;if(!P)return '';
  if(P.map)return `<div class="ov"><div class="card"><b>${esc(P.t)}</b><svg viewBox="0 0 100 94" onclick="mapClick(event)" style="width:100%;color:var(--tx);margin:8px 0;background:var(--bg);border-radius:10px">${COURT}${P.x!=null?`<circle cx="${P.x}" cy="${P.y}" r="2.4" fill="#7c5cff"/>`:''}</svg><div class="row"><button onclick="popNo()">${P.sk||'Passer'}</button><button class="p" ${P.x==null?'disabled':''} onclick="mapOk()">Confirmer ?</button></div></div></div>`;
  return `<div class="ov"><div class="card"><b>${esc(P.t)}</b>${P.html||''}<div class="row" style="margin:10px 0">${P.opts.map((o,i)=>`<button class="pl" style="flex:0 0 auto" onclick="popGo(${i})">${esc(o[0])}</button>`).join('')}</div><button style="width:100%" onclick="popNo()">${P.sk||'Passer'}</button></div></div>`;
}
function tap(t){
  const k=S.sel!=null&&court().includes(S.sel)?S.sel:null;
  if(k!=null){rec(k,t);draw();return;}
  S.ps=S.ps==t?null:t;draw();
}
function opp(t){add(t,null);draw();}
function pCourt(k){
  if(S.ps){const t=S.ps;S.ps=null;rec(k,t);draw();return;}

    if(p){const side=e.player>=1000?1:0;if(side)a+=p;else h+=p;pm(side,p);}

    const sec=(o,nm)=>`<div class="card"><div class="row"><b>${esc(nm)}</b><button class="nf good" onclick="saveTeam(${o})">💾 Enregistrer l'équipe</button></div><div class="row" style="margin:6px 0"><button onclick="pullTeam(${o})">🔄 Mettre à jour depuis l'équipe enregistrée</button></div><div class="row" style="margin:6px 0"><button onclick="tplXL()">⬇ Modèle Excel</button><button onclick="S.xo=${o};document.getElementById('xf').click()">📥 Importer Excel</button></div><div class="bubs">${S.m.roster.filter(p=>!!p.o==!!o).sort((a,b)=>a.n-b.n).map(p=>`<button class="bub" onclick="editP(${K(p)},${o})">${av(p)}<b>#${p.n}</b> ${esc(p.name)}<small>${esc(p.first||'')}${p.pos?' · '+p.pos:''}</small></button>`).join('')}<button class="bub add" onclick="editP(null,${o})">＋</button></div></div>`;
    body=(S.ev.length?'':'<button style="width:100%;margin-bottom:8px" onclick="initStart();S.tab=\'rec\';draw()">📋 Composition de départ</button>')+sec(0,S.m.team)+sec(1,oN)+'<input type="file" id="xf" accept=".xlsx,.xls,.csv" hidden onchange="impXL(this)">';
  }
  a.innerHTML=head+body+popH()+peH()+exH()+ckH()+dlgH();
}
